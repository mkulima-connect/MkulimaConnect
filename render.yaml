# Render deployment blueprint
services:
  - type: web
    name: mkulimaconnect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn MkulimaSystem.wsgi:application
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PAYMENT_GATEWAY_ENABLED
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mkulimaconnect-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.10"

databases:
  - name: mkulimaconnect-db
    plan: free
    databaseName: mkulimaconnect
    user: mkulimaconnect
