{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="profile-pic-container" style="text-align:center; margin-bottom:1rem;">
      <img src="{{ user.profile_picture.url }}" alt="Profile Picture" class="profile-pic">
    </div>
    <div class="profile-info-grid">
      <div><strong>{{ user.first_name }} {{ user.last_name }}</strong></div>
      <div><strong>Username:</strong> {{ user.username }}</div>
      <div><strong>Email:</strong> {{ user.email }}</div>
      <div><strong>Phone:</strong> {{ user.phone_number }}</div>
      <div><strong>Location:</strong> {{ user.location }}</div>
      <div><strong>Role:</strong> {{ user.get_role_display }}</div>
      <div><strong>Bio:</strong> {{ user.bio }}</div>
    </div>
  </div>
</div>
<style>
.auth-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 90vh;
  background: linear-gradient(120deg, #e5f2e5 0%, #f8f9fa 100%);
}
.auth-card {
  background: #fff;
  padding: 2.5rem 2rem 2rem 2rem;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  width: 100%;
  max-width: 600px;
}
.profile-pic {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #b5cbb7;
  margin-bottom: 0.5rem;
}
.profile-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem 2rem;
  margin-bottom: 1.5rem;
}
@media (max-width: 700px) {
  .profile-info-grid { grid-template-columns: 1fr; }
}
</style>
{% endblock %}
