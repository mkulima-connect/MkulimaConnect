{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="card" style="max-width:720px;margin:0 auto;">
  <h1>Edit Profile</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}

  </form>
</div>
{% endblock %}
